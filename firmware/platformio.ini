; Default build target is the round 1.28" GC9A01 pair on the ESP32-S3.
; `pio run` / `make` build this env. The ILI9341 retrofit envs are opt-in
; and must be named explicitly - never flash them to the round hardware.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = lolin_s3_mini  ; Correct board for 4MB flash
framework = arduino

; USB CDC settings for ESP32-S3 SuperMini
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries - removing TFT_eSPI to use manual control
lib_deps = 
    # No external libraries needed for manual SPI

; Custom build settings for TFT_eSPI
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>

; ---------------------------------------------------------------- ;
;  2.4" ILI9341 SPI TFT retrofit (GODIYMODULES) - a pair of panels  ;
;  for a 12ft-skeleton retrofit. Same board, same wiring, different ;
;  display driver - do NOT flash to the 1.28" round hardware.       ;
; ---------------------------------------------------------------- ;
[env:esp32-s3-devkitc-1-ili9341]
platform = espressif32
board = lolin_s3_mini
framework = arduino

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DPANEL_ILI9341=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps = 

build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>

; Classic ESP32 DevKit V1 (ESP-WROOM-32), same ILI9341 retrofit wiring.
; Pin map differs (GPIO 6-11 are flash pins on the classic chip; see
; src/boards/board_esp32dev.h). Uses CP2102 UART bridge, not USB-CDC.
[env:esp32-devkitc-v1-ili9341]
platform = espressif32
board = esp32dev
framework = arduino

build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DPANEL_ILI9341=1
    -DBOARD_ESP32DEV=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps = 

build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>