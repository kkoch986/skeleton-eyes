[env:esp32-s3-devkitc-1]
platform = espressif32
board = lolin_s3_mini  ; Correct board for 4MB flash
framework = arduino

; USB CDC settings for ESP32-S3 SuperMini
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries - removing TFT_eSPI to use manual control
lib_deps = 
    # No external libraries needed for manual SPI

; Custom build settings for TFT_eSPI
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>