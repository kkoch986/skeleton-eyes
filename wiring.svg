<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Consolas, monospace" font-size="13">
  <style>
    .box { fill: #f8f9fa; stroke: #333; stroke-width: 2; }
    .box-title { fill: #e9ecef; stroke: #333; stroke-width: 2; }
    .wire { fill: none; stroke: #555; stroke-width: 1.5; }
    .wire-label { fill: #666; font-size: 11px; }
    .pin { fill: #fff; stroke: #333; stroke-width: 1; }
    .pin-label { fill: #333; font-size: 11px; }
    .header { fill: #dee2e6; stroke: #333; stroke-width: 1; }
    .header-text { fill: #333; font-size: 11px; text-anchor: middle; }
    .i2c { stroke: #1a73e8; }
    .spi { stroke: #e37400; }
    .power { stroke: #d32f2f; }
    .gnd { stroke: #333; }
  </style>

  <!-- ESP32-S3 Board -->
  <rect class="box-title" x="300" y="10" width="300" height="24" rx="3"/>
  <text x="450" y="27" text-anchor="middle" font-weight="bold" font-size="14">ESP32-S3 Supermini (Eye Controller)</text>
  <rect class="box" x="300" y="34" width="300" height="260" rx="3"/>

  <!-- Pins left side S3 -->
  <circle class="pin" cx="310" cy="60" r="4"/>
  <text class="pin-label" x="318" y="64">IO13 — Left Eye CS</text>
  <circle class="pin" cx="310" cy="85" r="4"/>
  <text class="pin-label" x="318" y="89">IO9  — Right Eye CS</text>
  <circle class="pin" cx="310" cy="110" r="4"/>
  <text class="pin-label" x="318" y="114">IO12 — Shared RST</text>
  <circle class="pin" cx="310" cy="135" r="4"/>
  <text class="pin-label" x="318" y="139">IO8  — Shared DC</text>
  <circle class="pin" cx="310" cy="160" r="4"/>
  <text class="pin-label" x="318" y="164">IO11 — Shared MOSI</text>
  <circle class="pin" cx="310" cy="185" r="4"/>
  <text class="pin-label" x="318" y="189">IO10 — Shared SCLK</text>

  <circle class="pin" cx="310" cy="225" r="4"/>
  <text class="pin-label" x="318" y="229">IO4  — I2C SDA</text>
  <circle class="pin" cx="310" cy="250" r="4"/>
  <text class="pin-label" x="318" y="254">IO7  — I2C SCL</text>

  <circle class="pin" cx="310" cy="280" r="4"/>
  <text class="pin-label" x="318" y="284">5V / GND (from USB)</text>

  <!-- Left Eye Display -->
  <rect class="box-title" x="30" y="380" width="200" height="24" rx="3"/>
  <text x="130" y="397" text-anchor="middle" font-weight="bold" font-size="13">Left Eye — GC9A01</text>
  <rect class="box" x="30" y="404" width="200" height="170" rx="3"/>

  <circle class="pin" cx="220" cy="430" r="4"/>
  <text class="pin-label" x="160" y="434" text-anchor="end">CS</text>
  <circle class="pin" cx="220" cy="458" r="4"/>
  <text class="pin-label" x="160" y="462" text-anchor="end">RST</text>
  <circle class="pin" cx="220" cy="486" r="4"/>
  <text class="pin-label" x="160" y="490" text-anchor="end">DC</text>
  <circle class="pin" cx="220" cy="514" r="4"/>
  <text class="pin-label" x="160" y="518" text-anchor="end">SDA (MOSI)</text>
  <circle class="pin" cx="220" cy="542" r="4"/>
  <text class="pin-label" x="160" y="546" text-anchor="end">SCL (SCLK)</text>
  <circle class="pin" cx="220" cy="570" r="4"/>
  <text class="pin-label" x="160" y="574" text-anchor="end">VCC / GND</text>

  <!-- Right Eye Display -->
  <rect class="box-title" x="670" y="380" width="200" height="24" rx="3"/>
  <text x="770" y="397" text-anchor="middle" font-weight="bold" font-size="13">Right Eye — GC9A01</text>
  <rect class="box" x="670" y="404" width="200" height="170" rx="3"/>

  <circle class="pin" cx="680" cy="430" r="4"/>
  <text class="pin-label" x="688" y="434">CS</text>
  <circle class="pin" cx="680" cy="458" r="4"/>
  <text class="pin-label" x="688" y="462">RST</text>
  <circle class="pin" cx="680" cy="486" r="4"/>
  <text class="pin-label" x="688" y="490">DC</text>
  <circle class="pin" cx="680" cy="514" r="4"/>
  <text class="pin-label" x="688" y="518">SDA (MOSI)</text>
  <circle class="pin" cx="680" cy="542" r="4"/>
  <text class="pin-label" x="688" y="546">SCL (SCLK)</text>
  <circle class="pin" cx="680" cy="570" r="4"/>
  <text class="pin-label" x="688" y="574">VCC / GND</text>

  <!-- SPI Wires: S3 to Left Eye -->
  <path class="wire spi" d="M 314,60 L 260,60 L 260,430 L 216,430"/>
  <text class="wire-label" x="240" y="55" text-anchor="end">Left CS</text>
  <path class="wire spi" d="M 314,110 L 270,110 L 270,458 L 216,458"/>
  <path class="wire spi" d="M 314,135 L 280,135 L 280,486 L 216,486"/>
  <path class="wire spi" d="M 314,160 L 290,160 L 290,514 L 216,514"/>
  <path class="wire spi" d="M 314,185 L 300,185 L 300,542 L 216,542"/>

  <!-- SPI Wires: S3 to Right Eye -->
  <path class="wire spi" d="M 314,85 L 340,85 L 340,430 L 674,430"/>
  <text class="wire-label" x="500" y="80" text-anchor="middle">Right CS</text>
  <path class="wire spi" d="M 314,110 L 350,110 L 350,458 L 674,458"/>
  <text class="wire-label" x="500" y="440" text-anchor="middle">RST</text>
  <path class="wire spi" d="M 314,135 L 360,135 L 360,486 L 674,486"/>
  <text class="wire-label" x="500" y="478" text-anchor="middle">DC</text>
  <path class="wire spi" d="M 314,160 L 370,160 L 370,514 L 674,514"/>
  <text class="wire-label" x="500" y="506" text-anchor="middle">MOSI</text>
  <path class="wire spi" d="M 314,185 L 380,185 L 380,542 L 674,542"/>
  <text class="wire-label" x="500" y="534" text-anchor="middle">SCLK</text>

  <!-- ESP32-C3 Management Board -->
  <rect class="box-title" x="30" y="10" width="240" height="24" rx="3"/>
  <text x="150" y="27" text-anchor="middle" font-weight="bold" font-size="13">ESP32-C3 (Management Board)</text>
  <rect class="box" x="30" y="34" width="240" height="130" rx="3"/>

  <circle class="pin" cx="260" cy="65" r="4"/>
  <text class="pin-label" x="250" y="69" text-anchor="end">GPIO8 — I2C SDA</text>
  <circle class="pin" cx="260" cy="95" r="4"/>
  <text class="pin-label" x="250" y="99" text-anchor="end">GPIO9 — I2C SCL</text>
  <circle class="pin" cx="260" cy="130" r="4"/>
  <text class="pin-label" x="250" y="134" text-anchor="end">5V / GND (from USB)</text>

  <!-- I2C connection between C3 and S3 -->
  <path class="wire i2c" d="M 256,65 L 280,65 L 280,225 L 306,225"/>
  <text class="wire-label i2c" x="290" y="140" transform="rotate(-90,290,140)">I2C SDA</text>
  <path class="wire i2c" d="M 256,95 L 290,95 L 290,250 L 306,250"/>
  <text class="wire-label i2c" x="300" y="170" transform="rotate(-90,300,170)">I2C SCL</text>

  <!-- Note about left eye orientation -->
  <text x="130" y="595" text-anchor="middle" fill="#888" font-size="11">Left eye display is mounted upside down; rotation is handled in firmware.</text>

  <!-- Legend -->
  <rect class="box-title" x="480" y="310" width="180" height="24" rx="3"/>
  <text x="570" y="327" text-anchor="middle" font-weight="bold" font-size="12">Legend</text>
  <rect class="box" x="480" y="334" width="180" height="74" rx="3"/>
  <line x1="490" y1="350" x2="520" y2="350" class="wire spi"/>
  <text x="530" y="354" font-size="11">SPI (display bus)</text>
  <line x1="490" y1="370" x2="520" y2="370" class="wire i2c"/>
  <text x="530" y="374" font-size="11">I2C (control bus)</text>
  <line x1="490" y1="390" x2="520" y2="390" class="wire gnd"/>
  <text x="530" y="394" font-size="11">Power / GND</text>
</svg>
